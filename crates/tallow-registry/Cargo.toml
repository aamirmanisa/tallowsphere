[package]
name = "tallow-registry"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tallow fleet registry skeleton + receipt format v1 — file-backed device registry and an append-only, hash-chained, Ed25519-signed receipts ledger (local)"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tallow-admission = { path = "../tallow-admission" }
