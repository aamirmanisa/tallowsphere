[package]
name = "tallow-reader"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Protected Tallow extraction daemon — warm BrowserPool + stealth article extraction over an authenticated HTTP API"

[[bin]]
name = "tallow-reader"
path = "src/main.rs"

[dependencies]
tallow = { path = "../.." }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
dirs = "5"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
blake3 = "1"

[dev-dependencies]
tempfile = "3"
