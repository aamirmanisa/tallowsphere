[package]
name = "tallow-jobs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tallow jobs v1 — `.tl` recipe scheduler: priority queue, bounded retries, dead-letter, Ed25519-signed run receipts (local)"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tallow-registry = { path = "../tallow-registry" }

[[bin]]
name = "tallow-jobs"
path = "src/bin/tallow-jobs.rs"
