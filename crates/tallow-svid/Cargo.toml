[package]
name = "tallow-svid"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SPIFFE-style SVID workload identity for Tallow (W3 identity wave)"

[dependencies]
tallow-crypto = { path = "../tallow-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }
sha2 = "0.10"
hmac = "0.12"
blake3 = "1.8"
zeroize = "1"
tracing = "0.1"
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "aws-lc-rs"] }
rustls-pki-types = "1"
hex = "0.4"
rand = "0.8"
