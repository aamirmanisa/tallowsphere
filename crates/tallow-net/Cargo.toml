[package]
name = "tallow-net"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Networking layer for Tallow — QUIC, TCP+TLS, mDNS, NAT traversal, relay"

[features]
default = ["quic"]
quic = ["dep:quinn"]
onion = []
## Wired gate (T-113 / audit-01 F-2 / crypto-audit F1): when enabled the TLS
## client paths in src/transport/tls_config.rs use SkipServerVerification
## (self-signed relay/dev certs). When disabled — now the DEFAULT (fix-wave
## flip, 2026-09-28; not in `default`, and the relay edge is pinned with
## default-features = false) — clients require CA-validated certificates
## (webpki roots), validated against the TLS server name dialed
## (RelayClient::new_with_name / connect_with_server_name). Dev/test lanes opt
## IN explicitly (`--features dangerous_skip_verify`, or consumers'
## `dev-insecure` features); release builds must NOT enable it. Guarded by the
## crate's strict-default negative tests + the CI hardened-set job.
dangerous_skip_verify = []

[dependencies]
tallow-crypto = { path = "../tallow-crypto" }
# Workload/SVID identity fabric (R-5.1/R-5.9): reused by relay mutual auth
# (rows #145/#146, batch-4 lane J) — `relay_auth` protocol + `workload` tokens.
tallow-svid = { path = "../tallow-svid" }

# QUIC Transport
quinn = { version = "0.11", optional = true, default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }

# TLS (aws-lc-rs backend — ring has compile-time assertion bug on macOS ARM)
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs", "prefer-post-quantum"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "0.26"
tokio-rustls = "0.26"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }

# DNS (v0.25 uses rustls 0.23/aws-lc-rs, removing ring dependency)
hickory-resolver = { version = "0.26", default-features = false, features = ["https-aws-lc-rs", "tokio"] }

# Local Discovery
mdns-sd = "0.11"

# Hex encoding for mDNS TXT records
hex = "0.4"

# sha256 (SPKI pin hashing — spki_pin module)
sha2 = "0.10"

# Proxy
tokio-socks = "0.5"

# UPnP
igd-next = { version = "0.15", features = ["aio_tokio"] }

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# Utilities
bytes = "1"
rand = "0.8"
tracing = "0.1"
thiserror = "2"
zeroize = { version = "1", features = ["derive", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
