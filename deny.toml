[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# T-113: advisory verdicts are BLOCKING. The CI `deny` job no longer carries
# `continue-on-error`, so any advisory below fails the build. Scope is
# workspace-wide (a superset of the crypto/net/sqlite dep classes named in the
# ticket); add time-boxed `ignore` entries only with a documented exception.
#
# (2026-09-16, P5-O2: migrated to the cargo-deny 0.20 schema — the removed
# severity keys `vulnerability`/`notice` (upstream PR #611) are gone; scope
# fields use the 0.20 enums. Behavior kept: all scopes checked, findings fail
# unless listed below.)
unmaintained = "all"
# `warn`, not `deny`: cargo-deny has no per-crate yanked scope, so one yanked
# transitive crate would redden the whole gate. The wreq 5.x / wreq-util 2.2.x
# yanked line was retired by 2777b8f4 (2026-09-26 -> wreq 6.0.0-rc.31 +
# wreq-util 3.0.0-rc.14); the post-migration audit shows 0 yanked / 0 unsound
# (artifacts/sendtallow-w5-dependency-decisions-2026-09-26/logs/audit-post-A+B.json).
# Re-check on every dependency refresh.
yanked = "warn"
ignore = [
    # atomic-polyfill (unmaintained, no vulnerability) — transitive via
    # heapless 0.7 <- postcard 1.1.3 (latest). Unfixable until postcard moves
    # off heapless 0.7; re-check on every postcard release. Documented
    # exception (mirrors the product-side acceptance in
    # artifacts/sendtallow-optimization-2026-09-15/p1/DEPENDENCY-REMEDIATION.md).
    "RUSTSEC-2023-0089",
    # bincode 1.3.3 (unmaintained, no vulnerability) — direct dep of
    # tallow-crypto. Maintainers declare 1.3.3 the complete, frozen release;
    # its encoding is load-bearing (key serialization), so swapping encoders
    # would change persisted formats. Deferred by decision; revisit on CVE.
    "RUSTSEC-2025-0141",
    # fxhash (RUSTSEC-2025-0057) — transitive via selectors <- scraper
    # (HTML parsing). No patched line; replacing requires a scraper/selectors
    # upgrade arc. Build-time-only hashing (fxhash is a hasher impl), no
    # runtime exposure to untrusted input beyond normal parse paths.
    "RUSTSEC-2025-0057",
    # paste (RUSTSEC-2024-0436) — proc-macro (expand-time only) via
    # cryptoki 0.7 (PKCS#11 / YubiHSM integration). The macro is frozen and
    # functional; cryptoki 0.8+ drops it but is an API-breaking arc.
    "RUSTSEC-2024-0436",
    # pqcrypto-* (RUSTSEC-2026-0160/62/63/65/67) — "upstream PQClean project
    # being archived" (fresh disclosure 2026-09). The PQ set is a deliberate
    # guardrail decision (#172/#173 family: ML-KEM/Falcon/SPHINCS+/McEliece
    # kept for hybrid crypto); the C implementations are vendored and frozen.
    # Successor tracking (PQClean successors / rust-native PQ) = flagged to
    # the operator as a material finding; revisit at the next PQ bake-off.
    "RUSTSEC-2026-0160",
    "RUSTSEC-2026-0162",
    "RUSTSEC-2026-0163",
    "RUSTSEC-2026-0165",
    "RUSTSEC-2026-0167",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    # Unicode-3.0 — ICU4X data crates + unicode-ident (data license; required
    # by rustls/url/idna-era deps). Added 2026-09-16 (P5-O2 deny migration).
    "Unicode-3.0",
    # MPL-2.0 — file-level copyleft, permissive combination: selectors/
    # cssparser/attohttpc/pubgrub/option-ext/version-ranges families.
    # Satisfies the `LGPL-3.0-or-later OR MPL-2.0` choice of priority-queue.
    "MPL-2.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    # CDLA-Permissive-2.0 — webpki-roots / webpki-root-certs (Mozilla root
    # store data), same allowance as the product workspace.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Path dependencies to the workspace's own (unpublished) crates carry
# wildcard versions by convention; the path is the source of truth.
# Same allowance as the product workspace.
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
