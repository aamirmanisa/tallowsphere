# cargo-audit configuration — read by `cargo audit`, which the CI `audit`
# job runs directly (the rustsec/audit-check action was dropped 2026-11-05).
#
# This is the second half of a two-file record. `deny.toml` covers the
# cargo-deny gate; this file covers `cargo audit`, which resolves the lockfile
# including optional-feature crates that cargo-deny's feature resolution can miss.
# The reason for every entry below lives
# docs/operations/dependency-exceptions-2026-10-25.md — read it before changing
# anything here. That file was removed by the 2026-10-31 docs purge and no longer
# exists in this tree; the per-entry comments below are the surviving record.
# Same expiry: 2027-01-31, enforced by scripts/check_deny_expiry.py against the
# marker below (release gate + CI) rather than by the comment alone.
# review-deadline: 2027-01-31
[advisories]
ignore = [
    # ── the zstd 0.13.4 / zstd-safe 7.4.0 set, added 2026-11-02 ──────────────
    # Patched lines exist and tallow already builds on them: the workspace's own
    # `zstd` dependency is 0.14.3 (zstd-safe 8.2.0) since the 2026-11-02 bump. The
    # 0.13.4 / 7.4.0 copy survives in the lockfile only through two dependents that
    # pin the old line and cannot be moved here:
    #   * wreq-util 3.0.0-rc.14 — `zstd ^0.13.3` sits inside its DEFAULT `emulation`
    #     feature, which is also the only gate on `Profile`; tallow's default
    #     `stealth-http` client is built from `Profile` (src/stdlib/stealth_http.rs),
    #     so `default-features = false` is not available without removing the
    #     TLS-emulation client itself.
    #   * parquet 59.3.1 — `zstd` is one of its default codecs; only built under the
    #     optional `parquet-storage` feature.
    # Every advisory names one function; none of the three is called from this graph:
    #   * RUSTSEC-2026-0391 (zstd) — `stream::raw::{Encoder,Decoder}::with_context`.
    #     tallow uses `zstd::encode_all` / `zstd::decode_all` (src/stdlib/compress.rs,
    #     src/stdlib/transfer.rs) and wreq-util uses `stream::{Encoder,Decoder}::new`
    #     (emulate/compress.rs); both construct a fresh context per call.
    #   * RUSTSEC-2026-0398 (zstd-safe) — `seekable::Seekable::decompress`, compiled
    #     only with zstd-safe's `seekable` feature. Nothing in the workspace enables
    #     it (no `seekable`/`zstd_seekable` anywhere in src/, crates/ or Cargo.toml).
    #   * RUSTSEC-2026-0403 (zstd-safe) — `DCtx::decompress_stream` as reached via
    #     `zstd::stream::write::Decoder`. Neither caller uses that type; the advisory
    #     names `read::Decoder`, `decode_all` and the bulk API as unaffected, which
    #     are exactly the three entry points in use.
    # Re-decide by 2027-01-31 (the marker above, enforced by
    # scripts/check_deny_expiry.py). Delete all three entries in the commit that
    # moves wreq-util onto a zstd 0.14 line.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",

    # crypto-bigint 0.5.5 — timing variability. Reached via elliptic-curve 0.13
    # <- p256 <- hpke/age, and via opaque-ke/voprf. Our OPAQUE is Ristretto255;
    # the P-256 use is HPKE with ephemeral keys. No upgrade exists: age 0.12.1
    # and opaque-ke 4.0.1 both pin elliptic-curve 0.13.
    "RUSTSEC-2026-0387",

    # ── the libcrux set, all 0.0.7/0.0.8, all pinned by tfhe 1.8.2 ──────────
    # These crates are compiled only for `--features fhe`. No shipped artifact
    # enables FHE; the feature jobs build it to prove the bindings. They are
    # patched upstream (libcrux-sha3 >= 0.0.10, libcrux-secrets >= 0.0.6,
    # libcrux-aesgcm >= 0.0.9) but tfhe has not moved onto those lines.
    # Delete every entry here in the commit that bumps tfhe past the pins.
    "RUSTSEC-2026-0207",  # libcrux-sha3 0.0.8 — incremental SHAKE wrong output
    "RUSTSEC-2026-0208",  # libcrux-sha3 0.0.8 — AVX2 SHAKE-256 panic
    "RUSTSEC-2026-0209",  # libcrux-aesgcm 0.0.7 — AAD length not enforced
    "RUSTSEC-2026-0211",  # libcrux-aesgcm 0.0.7 — non-constant-time tag check
    "RUSTSEC-2026-0212",  # libcrux-secrets 0.0.5 — ct swap/select wrong on aarch64
    "RUSTSEC-2026-0124",  # libcrux-chacha20poly1305 0.0.7 — panic on overlong buffer
    "RUSTSEC-2026-0330",  # libcrux-kem 0.0.7 — panic on short seed
    "RUSTSEC-2026-0331",  # libcrux-kem 0.0.7 — panic on short hybrid keys
]
