[package]
name = "cliff-probe"
version = "0.1.0"
edition = "2021"
# Its own workspace root: without this, cargo refuses to build it from inside the
# tallowsphere workspace ("current package believes it's in a workspace when it's
# not") because it is deliberately not a member.
[workspace]

[dependencies]
# EXACTLY the version tallow-crypto pins (crates/tallow-crypto/Cargo.toml).
libcrux-aesgcm = "=0.0.8"
libcrux-platform = "=0.0.3"

[profile.release]
opt-level = 3
