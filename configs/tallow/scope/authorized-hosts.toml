# Tallowsphere — outbound authorization register
#
# Read by the scope gate (`src/scope.rs`). Deny-by-default: a host that is not
# listed here is refused before a socket is opened, exactly as the isolated
# scrape sandbox refuses an unlisted host before a circuit is built
# (/etc/scrape-isolated/scrape.yaml -> targets.allowlist).
#
# The doctrine this register implements is the project's own
# (docs/opsec/stealth-scanning-statement-of-intent.md, directives 1-2):
# confirm scope and authorization before anything else; read-only, public-data
# collection; no authentication surfaces, no credentials.
#
# That last clause is not enforced here — it is enforced in the type system.
# `Basis` (src/scope.rs) has no value for credential-gated work, and
# authenticated paths (/login, /account, /admin, /api/keys, ...) are refused on
# every basis. Editing this file cannot unlock either.
#
# ---------------------------------------------------------------------------
# Adding a target. Every entry needs all four of: host, basis, granted_by,
# granted_at. `expires_at` is strongly preferred; an entry without one is
# listed explicitly by `tallow scope list` as unbounded.
#
#   [[authorized]]
#   host = "shop.example"              # exact host, or "*.example" for
#                                      # subdomains of a domain you own.
#                                      # "*.example" does NOT cover the apex.
#   basis = "written-consent"          # ownership | written-consent |
#                                      # self-hosted | public-read-only
#   granted_by = "name or role"        # not "everyone"
#   granted_at = "2026-10-16"
#   expires_at = "2027-10-16"          # ISO date; lapses the day after
#   evidence = "docs/consent/foo.txt"  # REQUIRED for written-consent:
#                                      # an assertion is not a grant
#   methods = ["GET", "HEAD"]          # default; read-only unless justified
#   notes = "why this is in scope"
#
# Method vocabulary (closed; an unknown token is a malformed register):
#   GET HEAD POST PUT PATCH DELETE OPTIONS TRACE CONNECT
# Default for an omitted `methods` field is GET, HEAD. CONNECT is the
# raw-socket / port-scan verb (Scanner.scan and similar). It is grantable
# on an explicit operator line; it is never a default, and this shipped
# register does not grant it to any host. CONNECT here is not HTTP CONNECT
# (RFC 9110 proxy tunneling).
#
# Written-consent entries are refused without `evidence`. Ownership entries are
# refused if the grant has expired. Nothing else enables a target: absence of an
# entry, an unreadable register, or a malformed register all refuse every host.
# ---------------------------------------------------------------------------

# Loopback — the workspace's own infrastructure. Self-hosted by definition.
#
# POST is granted here and only here: a local model server (llama.cpp, Ollama,
# vLLM) and every self-hosted API this workspace runs take their request as a
# POST, and the llm completion path is a POST. The grant is still host-scoped and
# still denies CONNECT — a raw socket to loopback needs its own operator line.
[[authorized]]
host = "127.0.0.1"
basis = "self-hosted"
granted_by = "operator (workspace default)"
granted_at = "2026-10-16"
expires_at = "2027-10-16"
evidence = "loopback interface on this host"
methods = ["GET", "HEAD", "POST"]
notes = "local development and health checks"

[[authorized]]
host = "localhost"
basis = "self-hosted"
granted_by = "operator (workspace default)"
granted_at = "2026-10-16"
expires_at = "2027-10-16"
evidence = "loopback interface on this host"
methods = ["GET", "HEAD", "POST"]
notes = "local development and health checks"

# IPv6 loopback — same interface, same grant as 127.0.0.1. Added 2026-10-26 with
# N09; without an entry here every IPv6 scan refused scope:not-listed, which made
# the family unusable in this workspace even though the code path existed.
# A bracketed form ([::1]) is normalised to this key by the register.
[[authorized]]
host = "::1"
basis = "self-hosted"
granted_by = "operator (workspace default)"
granted_at = "2026-10-26"
expires_at = "2027-10-16"
evidence = "loopback interface on this host"
methods = ["GET", "HEAD", "POST"]
notes = "local development and health checks over IPv6"

# IANA-reserved documentation domain (RFC 2606): published for exactly this
# purpose, no authentication, no personal data.
[[authorized]]
host = "example.com"
basis = "public-read-only"
granted_by = "RFC 2606 reservation"
granted_at = "2026-10-16"
expires_at = "2027-10-16"
evidence = "RFC 2606 — reserved for documentation and testing"
methods = ["GET", "HEAD"]
notes = "test fixture target"

[[authorized]]
host = "www.example.com"
basis = "public-read-only"
granted_by = "RFC 2606 reservation"
granted_at = "2026-10-16"
expires_at = "2027-10-16"
evidence = "RFC 2606 — reserved for documentation and testing"
methods = ["GET", "HEAD"]
notes = "test fixture target"

# Public egress-check service: reports the source IP a target would see, which
# is how an anonymity claim gets measured rather than asserted. No authentication.
[[authorized]]
host = "check.torproject.org"
basis = "public-read-only"
granted_by = "published public service"
granted_at = "2026-10-16"
expires_at = "2027-10-16"
evidence = "https://check.torproject.org — public, unauthenticated"
methods = ["GET", "HEAD"]
notes = "egress-plane proof (see toregress); the target sees a Tor exit, never the box IP"

# Chrome-for-Testing artifact bucket — the download plane for the pinned
# browser, not a scrape target. `tallow browser install` builds the URL from the
# in-repo pin table (`src/browser/cft_pins.rs`), so the only thing this entry
# authorizes is fetching a compile-time-pinned, digest-verified build. Without
# it the installer is refused as `scope:not-listed` *before* the GET and the CLI
# exits 5 (IO_ERROR); that is what took the CI Browser suites and WordPress jobs
# red on 2026-11-02.
#
# This is a supply-chain fetch of a public artifact, carried on the plain
# HTTP egress plane, not an authorization to read any host's content: no
# authentication, no cookies, no personal data, no crawl surface follows from it
# (`chrome-for-testing-public` exposes only release zips). Kept to exact host,
# GET/HEAD, with an expiry like every other grant.
#
# Verified 2026-11-02 (this change): the pinned artifact
# `156.0.8078.47/linux64/chrome-headless-shell-linux64.zip` answers HTTP 200 and
# its SHA-256 matches the row in `src/browser/cft_pins.rs`
# (0d5acc62c3e213f8c87d3c298d66ffcf9a236d12ea4b9f85318bf85dbc279daa), so this
# grant is sufficient on its own: the pinned install path never reads
# `googlechromelabs.github.io` — that host is only contacted by the unpinned
# "latest stable" fallback, which is not reached while a pin exists for the
# platform.
[[authorized]]
host = "storage.googleapis.com"
basis = "public-read-only"
granted_by = "published public artifact service (Google Chrome for Testing)"
granted_at = "2026-11-02"
expires_at = "2027-11-02"
evidence = "https://googlechromelabs.github.io/chrome-for-testing/ — public, unauthenticated release bucket"
methods = ["GET", "HEAD"]
notes = "pinned Chrome-for-Testing install only (src/browser/cft_pins.rs, src/browser/download.rs)"
