name: Release

# The engine repo's own release pipeline.
#
# Why this file exists: until now the only release workflow lived in the `~/Nixe`
# workspace and built from a filtered copy of this tree, so a tag here could not
# produce an artifact and nothing in this repository proved that the five shipped
# targets compile. A tag now builds, checksums, signs and drafts a release from
# this tree — nothing is published automatically.
#
# LOCALITY: actions are pinned to full commit SHAs (resolved with `git ls-remote`).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload artifacts and draft a release (leave off to build only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ── Gate: nothing is built before the tree proves itself ───────────────
  gate:
    name: Release gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Assert tag ↔ Cargo.toml version consistency
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "not a tag run (ref type: ${GITHUB_REF_TYPE}) — version check skipped"
            exit 0
          fi
          ver="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')"
          tag="${GITHUB_REF_NAME#v}"
          [ -n "$ver" ] || { echo "could not read version from Cargo.toml"; exit 1; }
          if [ "$ver" != "$tag" ] && [ "$ver" != "$tag.0" ]; then
            echo "Cargo.toml version '$ver' does not match tag '$GITHUB_REF_NAME' — refusing to build a mislabeled release"
            exit 1
          fi
          echo "version '$ver' consistent with tag '$GITHUB_REF_NAME'"

      - name: Static gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/panic_policy_check.py
          python3 scripts/claims_ledger_check.py
          python3 scripts/check_capability_registry.py
          python3 scripts/check_ffi_symbols.py
          python3 scripts/check_test_coverage.py

      - name: Full lib suite
        shell: bash
        run: cargo test --lib --locked -- --test-threads=2

  # ── Build one archive per shipped target ───────────────────────────────
  build:
    name: build ${{ matrix.label }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # GNU, not musl: the C++ dependency stack (btls-sys) is compiled with the
          # host C++ compiler, which produces glibc-only fortified symbols
          # (__snprintf_chk, __memcpy_chk, __isoc23_strtoul). A musl link therefore
          # fails unless a musl C++ cross toolchain is present, and Ubuntu ships
          # musl-gcc without musl-g++. Measured 2026-10-20; see register row #130.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
          - os: macos-15
            target: x86_64-apple-darwin
            label: macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write        # keyless Sigstore signing
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The toolchain must be the one rust-toolchain.toml pins (1.98.1). Asking
      # for `stable` installs the target's std for stable only, while cargo then
      # runs the pinned 1.98.1 toolchain -- which has no std for the cross
      # targets, so every cross build died with E0463 "can't find crate for
      # `core`" (linux-aarch64 and macos-x86_64 on 2026-10-21).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Compiler cache (sccache)
        # Every tag rebuilt 543 crates from scratch. The five build jobs took
        # 12-16 minutes each and almost all of it was dependencies that had not
        # changed since the previous tag. sccache keys each object on compiler,
        # flags and source hash, so unchanged crates -- and BoringSSL's C++
        # translation units -- are hits across tags and across the matrix; only
        # the tallow crate itself recompiles.
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Enable sccache (local object store)
        # Measured on the first cached attempt (cold 39704345890, warm 39708330189):
        # the GitHub-cache backend recorded 716 failed writes out of 992 compiles on
        # linux-x86_64 and delivered an 11.8% hit rate. The repository cache is
        # already largely spent on the ten CI jobs' 300-700 MB rust-cache entries,
        # so per-object writes do not survive. One archive per target is the shape
        # that fits: a single entry, restored whole, no per-object traffic.
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$GITHUB_WORKSPACE/.sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=2500M" >> "$GITHUB_ENV"
          echo "SCCACHE_LOG=error" >> "$GITHUB_ENV"
          echo "SCCACHE_ERROR_LOG=$GITHUB_WORKSPACE/sccache-error.log" >> "$GITHUB_ENV"

      # No Windows target-directory cache. It was added on 2026-10-22 and then
      # measured twice: the first run never restored it (step 0 s, a miss), and
      # the second restored 563 MB in 11 s and built the binary in 1148 s --
      # against 885 s for the same tree without it, with sccache at 93.05 % in
      # both cases. Unit time went 1665 s -> 2140 s, and the build-script block
      # it was supposed to skip grew (btls-sys 207 -> 315 s, aws-lc-sys 126 ->
      # 169 s). Restoring a target dir gives cargo fingerprints with fresh
      # mtimes, so the scripts it was meant to skip re-run anyway. Removed.

      - name: Restore the compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.sccache
          # The exact key never repeats; restore-keys finds the newest cache for
          # this triple, which is what makes a tag that only touches src/ hit.
          key: sccache-${{ matrix.label }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ matrix.label }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            sccache-${{ matrix.label }}-

      # No registry cache here on purpose. Measured: it cost 103 s on Windows to
      # restore 0.6 GB of crates the prefetch below fetches in 4-78 s, and the
      # repository's 10 GB cache budget is what the compiler archives need.
      - name: Pre-fetch the dependency graph
        shell: bash
        run: cargo fetch --locked --target ${{ matrix.target }}

      - name: Cross toolchain (aarch64 Linux)
        # This runner is x86_64. Building aarch64 here needs a C and C++ cross
        # compiler: btls-sys compiles C++ (cbs.cc) and cc-rs otherwise invokes the
        # host gcc, whose glibc headers emit __snprintf_chk / __memcpy_chk and
        # fail the aarch64 link exactly as they failed on the build box.
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"

      - name: System libraries the runtime archive references (Linux)
        # libtallow.a carries objects that reference system lzma/bz2. Without
        # these the archive builds but every program linking it fails with
        # "/usr/bin/ld: cannot find -llzma" -- which is exactly what the
        # packaged-binary smoke step caught on 2026-10-21.
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y liblzma-dev libbz2-dev

      - name: Keep the scanner off the build tree (Windows)
        # windows-latest runs Defender with real-time scanning on by default, and
        # this build writes a 46 MB executable and a 527 MB static archive. The
        # exclusion is best-effort: a runner that refuses the cmdlet still builds,
        # it just pays the scan.
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction Stop
          Add-MpPreference -ExclusionPath "$env:CARGO_HOME" -ErrorAction Stop
          Add-MpPreference -ExclusionProcess "rustc.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "link.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "lib.exe" -ErrorAction SilentlyContinue

      - name: Build (binary)
        shell: bash
        run: |
          start=$(date +%s)
          cargo build --profile release --locked --target ${{ matrix.target }} --bin tallow --timings
          echo "::notice::bin build $(( $(date +%s) - start ))s"

      - name: Where the build spent its time
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, json
          files = sorted(glob.glob('target/cargo-timings/cargo-timing-*.html'))
          if not files:
              print('no timings report')
          else:
              src = open(files[-1], encoding='utf-8').read()
              start = src.index('UNIT_DATA = [')
              end = src.index('\n];', start)
              units = json.loads(src[start + len('UNIT_DATA = '):end + 2])
              top = sorted(units, key=lambda u: -(u.get('duration') or 0))[:12]
              total = sum((u.get('duration') or 0) for u in units)
              print(f'units: {len(units)}  total unit time: {total:.1f}s')
              for u in top:
                  print(f"  {(u.get('duration') or 0):8.1f}s  {u.get('mode','?'):10} {u.get('name','?')}")
          PY

      - name: Build (runtime archive)
        shell: bash
        run: |
          # libtallow.a is the archive the compiler links compiled programs
          # against; it must be shipped beside the binary (see
          # scripts/package_release.sh) or every program that calls a runtime
          # symbol fails to link on a machine without a build tree.
          start=$(date +%s)
          cargo build --profile release --locked --target ${{ matrix.target }} --lib
          echo "::notice::lib build $(( $(date +%s) - start ))s"

      - name: Compiler cache statistics
        # The hit rate is the number that explains a fast or slow build; without
        # it a regression is indistinguishable from a cold cache.
        if: always()
        shell: bash
        run: |
          sccache --show-stats || true
          if [ -s sccache-error.log ]; then
            echo "sccache error log:"
            tail -20 sccache-error.log
          fi

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          ver="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')"
          bash scripts/package_release.sh "${{ matrix.target }}" "$ver" --out dist

      - name: Smoke — the packaged binary compiles and runs a program
        # Only where the artifact's architecture is the runner's. A cross-built
        # aarch64 ELF or x86_64 Mach-O cannot execute here: on 2026-10-21 the
        # aarch64 job died with "Exec format error" before it could prove
        # anything. Cross targets get the structural check below instead, and
        # the runtime proof comes from the native leg plus the CI test matrix.
        if: matrix.label == 'linux-x86_64' || matrix.label == 'windows-x86_64' || matrix.label == 'macos-aarch64'
        shell: bash
        run: |
          set -euo pipefail
          # The version string alone proves nothing about linkage: this program
          # calls a runtime symbol (tallow_print_optional), which is exactly what
          # a missing libtallow.a breaks.
          cat > smoke.tl <<'TL'
          fn find(hit: bool) -> i64? {
              if hit { return 7 }
              return nil
          }
          fn main() {
              print(find(true))
              print(find(false))
          }
          TL
          case "${{ matrix.target }}" in
            *-windows-*)
              exe=$(ls dist/*.zip); mkdir -p unpack && (cd unpack && unzip -q "../$exe")
              ./unpack/tallow.exe --version
              ./unpack/tallow.exe run --require-native smoke.tl | grep -qx 7 ;;
            *)
              a=$(ls dist/*.tar.gz); mkdir -p unpack && tar xzf "$a" -C unpack
              ./unpack/tallow --version
              out=$(cd unpack && ./tallow run --require-native ../smoke.tl)
              echo "$out"
              echo "$out" | head -1 | grep -qx 7
              ;;
          esac

      - name: Structural check — cross-built archive
        if: matrix.label == 'linux-aarch64' || matrix.label == 'macos-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          a=$(ls dist/*.tar.gz)
          mkdir -p unpack
          tar xzf "$a" -C unpack
          test -x unpack/tallow
          # The runtime archive must travel with the compiler, or programs that
          # call a runtime symbol fail to link on the target machine.
          test -f unpack/libtallow.a
          # The architecture the tag promises, as recorded in the file header.
          case "${{ matrix.target }}" in
            aarch64-*) file unpack/tallow | grep -q 'aarch64' ;;
            x86_64-*)  file unpack/tallow | grep -q 'x86_64'  ;;
          esac
          # The version is baked in at compile time; a mislabeled artifact is
          # the failure this catches.
          grep -aq "$(grep -m1 '^version' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')" unpack/tallow

      - name: Conformance — both planes against the packaged binary
        # Runs only where the archive's architecture matches the runner: an
        # aarch64 binary cannot execute here. This is the check that caught the
        # archive shipping without libtallow.a.
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: python3 conformance/run.py --tallow "$PWD/unpack/tallow"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.2.4'

      - name: Sign archive (Sigstore keyless)
        shell: bash
        run: |
          set -euo pipefail
          for a in dist/*.tar.gz dist/*.zip; do
            [ -e "$a" ] || continue
            cosign sign-blob --yes --tlog-upload=true "$a" --output-signature "$a.sig"
          done

      - name: Attest build provenance (SLSA L2)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Both archive shapes: the Windows leg produces a .zip, and a
          # tar.gz-only glob made the attest step fail with
          # "Could not find subject at path dist/*.tar.gz" after the Windows
          # archive had already been built, signed and smoke-tested.
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tallow-${{ matrix.label }}
          path: dist/*
          retention-days: 30

  # ── Draft release (manual dispatch with publish=true, or a v* tag) ─────
  publish:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tallow-*
          path: release-assets
          merge-multiple: true

      - name: Verify every archive has a checksum and a signature
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          n=0
          for a in *.tar.gz *.zip; do
            [ -e "$a" ] || continue
            [ -f "$a.sha256" ] || { echo "MISSING $a.sha256 — refusing to publish"; exit 1; }
            [ -f "$a.sig" ]    || { echo "MISSING $a.sig — refusing to publish"; exit 1; }
            sha256sum -c "$a.sha256"
            n=$((n+1))
          done
          echo "verified $n archive(s)"
          [ "$n" -eq 5 ] || { echo "expected 5 archives, found $n"; exit 1; }

      # Every release must say WHAT WAS WRONG and WHAT WAS FIXED. The body is
      # generated from CHANGELOG.md, and this step fails when the section for
      # the tag is missing or lacks either heading — so a release with no
      # explanation never reaches the drafts.
      - name: Build release body from the changelog
        run: python3 scripts/release_body.py "${{ github.ref_name }}" > release_body.md

      - name: Draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          tag_name: ${{ github.ref_name }}
          name: "Tallow ${{ github.ref_name }}"
          draft: true
          prerelease: false
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
