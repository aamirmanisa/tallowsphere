name: CI

# Carried from the development tree, scoped to what this repository can actually run.
#
# The development tree's ci.yml has 15 jobs. Thirteen are carried, and two are not — each for a reason
# that was MEASURED here rather than assumed, because a gate that cannot pass is worse than a gate
# left behind (a permanently red check gets ignored). Their inputs are carried anyway, so adopting
# any of them later is a one-line change:
#
#   vet            inputs carried (`supply-chain/{config,audits.toml,imports.lock}`) but the ledger
#                  is empty — `audits.toml` is 35 bytes — so `cargo vet --locked` has nothing to
#                  certify against. Unproven here; not wired.
#   claims-ledger  **carried as of 2026-10-20.** It was rc=1 with 23 hard findings, every one a
#                  "missing source file" anchor to a document never committed here (CLAUDE.md,
#                  tallow_1000x_upgrade_prompt.md, docs/mega/tallow-2.0-spec.md, .planning/*).
#                  The anchors now resolve to docs/mega/claims-provenance-gaps.md, which records
#                  each original anchor verbatim and is explicitly not a claim that the original
#                  text still exists. The 26 remaining R4 sweep warnings were then attributed by
#                  anchor (four new rows) or removed as false positives in the patterns themselves
#                  (`BLAKE2s` matching "2s"; "Government & Military" matching a banned adjective).
#                  Current: 72 entries, 0 hard, 0 warnings, rc=0. The job accepts 0|2.
#   fmt            the tree is not cargo-fmt clean: `cargo fmt --all -- --check` reports 7,902
#                  files and 121,519 diff lines (import-ordering style — `use std::sync::{Arc, mpsc}`
#                  against `{mpsc, Arc}`), i.e. rustfmt has never been run across this workspace.
#                  That is a repo-wide style decision, not a defect to fix in passing.
#
# `sbom-drift` and `cbom-drift` ARE carried, together with their inputs and their regenerated
# artifacts. Carrying them surfaced a real upstream defect worth recording: **both gates failed on
# drift when first run**, which means neither could pass anywhere — the committed artifacts were
# stale relative to the source (the crypto inventory was short by ~99 occurrences; the SBOM was
# short by 77 packages, including a dependency absent from the snapshot entirely). A gate that is
# not wired into a runner is not a check; these two are now wired here and green:
#
#   cbom-drift   scripts/crypto-inventory.py --check scripts/crypto-inventory.json
#                44 registered, 44 present, 2,124 occurrences, 0 unregistered candidates
#   sbom-drift   scripts/sbom-gen.py --check scripts/sbom.snapshot.json   (751 packages)
#
# A stale figure still circulates in the development tree's ci.yml: "463 occurrences across 16
# algorithms". The artifact says otherwise — 44 algorithms — and has for some time. The number is a
# comment, not a measurement, and it is corrected here rather than inherited.
#
# The three platform `test-*` jobs are green at this revision: `cargo test -p tallow --lib` reports
# 9,007 passed / 0 failed / 21 ignored at `bb31b3f`. They were red at `9d3b1f5` on eleven stale room-code
# fixtures in `src/stdlib/transfer_net.rs` (8,996 / 11 / 21) that passed human-readable codes to a join
# contract accepting the 8-symbol mint only. The fixtures now take their code from the runtime's own mint —
# test-side only, inside `mod tests` — so the contract and the tests cannot drift apart again.
#
# `RUSTFLAGS: -D warnings` is deliberately NOT set at workflow level. This tree carries a
# pre-existing warning baseline (159 in the lib test target alone, e.g. the Rust 2024
# `unsafe_op_in_unsafe_fn` lint in src/runtime/{env,html}_ffi.rs); with `-D warnings` every cargo
# job below would fail on warnings predating this repository, which measures nothing. The
# development tree's own parity job neutralizes the same variable for the same reason. Making
# warnings blocking is a separate work item, not a side effect of publishing.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  # Manual dispatch exists so a merge made through the API — which can land
  # without a push-triggered run — still has a way to be verified on main.
  workflow_dispatch:

# Two pushes to the same ref used to queue two full 12-job runs, so the wall
# time you waited for was twice what the tree needed. A superseded run has no
# value once the next commit exists; cancellation on PRs only, so a push to main
# never kills a run that might still be gating a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 8388608

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (SHA pin)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # One shared key: ten per-job caches at ~0.7 GB each were consuming
          # 7 GB of the repository's 10 GB budget and evicting the release
          # compiler archives that actually deliver the speedup.
          shared-key: tallow-ci
      - run: cargo check --locked --workspace --all-targets

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    needs: check
    steps:
      # fetch-depth: 0 -- attribution needs the base revision present in the clone
      # so a failing test can be re-run against it; a shallow clone cannot reach
      # the merge-base and every label would come back UNKNOWN.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # One shared key: ten per-job caches at ~0.7 GB each were consuming
          # 7 GB of the repository's 10 GB budget and evicting the release
          # compiler archives that actually deliver the speedup.
          shared-key: tallow-ci
      - name: Test
        # 4 threads, not 2: the suite is 9,147 independent unit tests and the
        # runner has 4 cores. At 2 threads the executing half alone was ~5
        # minutes of a 9.5-minute job. Measured on run 39701448323 (2 threads:
        # 555 s) against the first 4-thread run; revert if a timing-sensitive
        # test fails.
        run: |
          set -o pipefail
          cargo test --locked --lib -- --test-threads=4 2>&1 | tee "$RUNNER_TEMP/test.log"
      # Every failing test is labelled pre-existing or caused by RUNNING it at the
      # base revision (scripts/attribute_failure.py, docs/FAILURE-ATTRIBUTION.md).
      # That costs a build of the base tree, on failure only -- the label is proven
      # rather than guessed. The other two test jobs follow this shape.
      - name: Attribute failures
        if: failure()
        run: python3 scripts/attribute_failure.py --log "$RUNNER_TEMP/test.log"

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # One shared key: ten per-job caches at ~0.7 GB each were consuming
          # 7 GB of the repository's 10 GB budget and evicting the release
          # compiler archives that actually deliver the speedup.
          shared-key: tallow-ci
      # The Windows leg is the wall on every run (11.4 min at 2 threads, 10.8 at
      # 4) and it sits on the critical path of a PR that will not merge on a
      # Windows-only test failure that Linux did not also fail. What Windows
      # uniquely catches here is the compile plane -- unix-only code compiled for
      # a Windows target has broken this tree twice. So: compile every target on
      # a PR, run the full 9k suite on main and on tags.
      - name: Compile plane (pull requests)
        if: github.event_name == 'pull_request'
        run: cargo check --locked --workspace --all-targets
      - name: Restore the target directory
        if: github.event_name != 'pull_request'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: citarget-windows-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            citarget-windows-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            citarget-windows-
      - name: Test
        if: github.event_name != 'pull_request'
        run: cargo test --locked --lib -- --test-threads=4

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # One shared key: ten per-job caches at ~0.7 GB each were consuming
          # 7 GB of the repository's 10 GB budget and evicting the release
          # compiler archives that actually deliver the speedup.
          shared-key: tallow-ci
      - run: cargo test --locked --lib -- --test-threads=4

  # Zero-trust conformance: negative boundary probes (browser-zone predicate refusals,
  # non-loopback CDP connect refusals, the CDP relay's 8 MiB frame cap — loopback only, no network).
  zero-trust-conformance:
    name: Zero-trust conformance (negative boundary probes)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (SHA pin)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # One shared key: ten per-job caches at ~0.7 GB each were consuming
          # 7 GB of the repository's 10 GB budget and evicting the release
          # compiler archives that actually deliver the speedup.
          shared-key: tallow-ci
      - run: cargo test --locked --test zero_trust_conformance -- --test-threads=1

  # Contract and CLI integration suites.
  #
  # `cargo test --lib` cannot see tests/*.rs at all, so before this job existed 58 of the 60
  # integration targets ran in no pipeline. That is how tests/fixtures/audit_golden/cra.json sat
  # failing, unnoticed, through a version bump: the contract it pins was executed by nothing.
  #
  # The eight below were RUN here on 2026-10-16, not assumed, and are green at that revision.
  # `--no-fail-fast` so that a future break in one suite still reports the other seven.
  #
  # Four candidates were run and excluded. Three are real defects in this tree rather than suites
  # that cannot execute, and fixing them belongs where the code is — wiring a red check would only
  # teach us to ignore it:
  #
  #   request_plan_cli       0 / 38   every test fails identically: `error: unexpected argument
  #                                   '--check' found` — the verb this suite drives is not in this build
  #   pkg_cli                FIXED and promoted above — pkg remove now deletes the package directory
  #                                   (remove_dir_all, with failures surfaced) — verified 14 passed, 0 failed
  #   sec1_honesty_sweep     FIXED and promoted above — the assertion was the stale side; the document's 23
  #                                   matches src/main.rs's 23 named flags — verified 9 passed, 0 failed
  #   http_result_model      FIXED and promoted above — the typed BatchResponse/HttpError model now exists
  #                                   (http_batch classifies 4xx as a result carrying its body, transport
  #                                   failures as kind "transport"), and stdlib/http.tl declares it —
  #                                   verified 3 passed, 0 failed. The status-as-error override is scoped to
  #                                   a function-local agent on the loopback path, so http.get/post semantics
  #                                   are unchanged (http unit tests still 61 passed, 0 failed).
  contract-cli:
    name: Contract and CLI suites (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: check
    # Sharded, not one 140-target job. The single job measured 43-45 min
    # against a 45-minute limit and was killed by that limit twice
    # (run 41574382080 on main, run 41674321593 attempt 1 on a PR), each time
    # after ~45 minutes of work. The wall was the defect, not the tests.
    # Three shards put each leg near 15 min, so 30 is 2x headroom.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (SHA pin)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # One shared key: ten per-job caches at ~0.7 GB each were consuming
          # 7 GB of the repository's 10 GB budget and evicting the release
          # compiler archives that actually deliver the speedup.
          shared-key: tallow-ci
      - name: Install age(1) for the interop suites
        # age_container and age_native_parity decrypt with the reference
        # implementation and encrypt with ours in both directions. Without the
        # binary they panic with "install age to run this test" — which is a
        # missing dependency reported as a test failure.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          age --version
      - name: Install the native link dependencies (clang, liblzma, libbz2)
        # First, before any test runs: the native plane links generated programs
        # through clang and the runtime archive references -llzma and -lbz2.
        # Installing this later only fixed the parity runner, after the
        # cargo-test steps had already failed at link time.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang liblzma-dev libbz2-dev
      - name: Capability registry matches the code
        run: |
          python3 scripts/census_page_methods.py
          python3 scripts/census_surface.py
          python3 scripts/check_ffi_symbols.py
          python3 scripts/check_capability_registry.py
      - name: Every test target is run or explicitly excluded
        run: python3 scripts/check_test_coverage.py
      - name: Every DONE backlog row cites a real path
        # A DONE claim whose evidence is `symbol:748` in an unnamed file cannot be
        # checked, and a stale line number is how the claim goes false silently.
        run: python3 scripts/check_backlog_evidence.py
      - name: Build the engine for the parity runner
        # --lib as well as --bin: the runner needs target/debug/libtallow.a next
        # to the binary, which only the `staticlib` crate-type target produces.
        run: cargo build --locked --lib --bin tallow
      - name: Documentation examples run
        # G59. Every ```tallow / ```tl block must carry `run`, `run:fail:<CODE>`
        # or `skip:<reason>`; the `run` ones are executed here. An unmarked block
        # is a failure, because silence is how an example rots into a lie.
        run: python3 scripts/docs_examples.py
      - name: Parity fixtures (interpreter vs native, both planes)
        # parity_runner was excluded as unclassified. It was failing because the
        # runner treated every non-zero interpreter exit as an error, so the
        # *_refusal fixtures could never land in a named class. With
        # `Expect::RefuseBoth` they do: 10 MATCH, 4 REFUSED, 0 diverge.
        run: cargo test --locked --test parity_runner
      - name: Run this shard's contract and CLI targets
        # Index split, not hand-picked groups: the slowest target
        # (codegen_fallthrough, ~11 min of native relinking on its own) lands
        # in exactly one shard and the rest spread evenly.
        #
        # The target list stays as literal `--test <name>` text on purpose:
        # scripts/check_test_coverage.py scans ci.yml with
        # `re.findall(r"--test\s+([a-z0-9_]+)")` to prove every tests/*.rs file
        # is run or registered as debt. A bare bash array of names broke that
        # gate on the first attempt at this shard.
        env:
          SHARD_TARGETS: |
            --test audit_cli_contract
            --test array_methods
            --test bp22_array_lowerings
            --test language_surface
            --test pattern_destructure
            --test doctest
            --test module_visibility
            --test browser_page_helpers
            --test llm_providers
            --test journal_crash_safety
            --test mesh_plan_tl
            --test mesh_run_tl
            --test mesh_llm_tl
            --test egress_ledger
            --test egress_gate_coverage
            --test http_batch_scope_parity
            --test mesh_remote
            --test mesh_workers
            --test browser_sentinels_tl
            --test directorate_desks
            --test egress_census
            --test chained_native_array_len
            --test egress_scope_gate
            --test process_contract
            --test request_plan_cli
            --test perf_binary_startup
            --test perf_install
            --test llm_native_parity
            --test crypto_capability_registry
            --test hpke_rfc9180
            --test pq_tls_group
            --test age_container
            --test opaque_flow
            --test secret_display
            --test age_native_parity
            --test opaque_native_parity
            --test keypair_native_parity
            --test kats
            --test age_stream
            --test mutation_robustness
            --test rotation_drill
            --test zeroize_adoption
            --test mesh_plan_parity
            --test stdlib_method_refusals
            --test transfer_transport
            --test injection_redteam
            --test ombuds_mesh_tl
            --test fingerprint_audit_cli
            --test http_result_model
            --test http_status_as_data_parity
            --test pkg_cli
            --test replay_determinism
            --test scope_gate
            --test sec1_honesty_sweep
            --test stdlib_scraper_doctor_cli
            --test transport_coherence_audit
            --test vault_enforcement_cli
            --test veil_connect_cli
            --test pkg_archive
            --test pkg_cache
            --test stdlib_math_env
            --test transfer_bwlimit
            --test crawler_parity
            --test interp_codegen_parity
            --test string_index_bounds
            --test generated_tl_parity
            --test optional_parity
            --test process_exec_parity
            --test result_truthiness_parity
            --test result_payload_typing
            --test fuzz_safety
            --test enum_semantics_parity
            --test match_exhaustiveness_parity
            --test truthiness_parity
            --test data_enum_print_parity
            --test fn_value_call_parity
            --test format_spec_parity
            --test deals_integration
            --test artifact_sealing
            --test browser_contracts
            --test browser_dispatch_reachability
            --test browser_fallback_service
            --test closure_capture_return
            --test copy_engine_basic
            --test derived_recompute
            --test export_gate_matrix
            --test extraction_migration
            --test fingerprint_coherence_suite
            --test fingerprint_policy_pass_e2e
            --test fixity_drill
            --test kt_log_read_only
            --test mcp_client
            --test pkg_import
            --test pkg_lockfile
            --test pkg_manifest
            --test pkg_registry
            --test pkg_resolver
            --test proxy_layers_integration
            --test relay_ws_interop
            --test sigpipe_pipeline
            --test stdlib_dispatch
            --test stdlib_fs
            --test stdlib_json
            --test stdlib_rand
            --test stdlib_time_log
            --test struct_array_parity
            --test float_array_parity
            --test print_array_refusal
            --test structured_data_parity
            --test transfer_chunk_parity
            --test exit_in_conditional
            --test fs_read_file_native
            --test native_fn_decl
            --test optional_implicit_wrap
            --test optional_exhaustiveness
            --test optional_match_unwrap
            --test script_mode
            --test api_parity_native
            --test checker_diagnostics
            --test effect_rows
            --test intel_ip_fixtures
            --test intel_api_method_matrix
            --test language_ergonomics
            --test len_scalar_parity
            --test module_value
            --test named_default_parity
            --test scope_adversarial
            --test scope_grant_runtime
            --test stdlib_bridge_returns
            --test bridge_marshal_adversarial
            --test bridge_overhead
            --test callnorm_adversarial
            --test newtype_parity
            --test unsupported_net_refusal
            --test capability_inference
            --test bridge_ownership_adversarial
            --test defer_parity
            --test codegen_fallthrough
            --test async_await_idempotent
            --test await_payload_kinds
            --test gate_capability_registry_parity
            --test gate_census_page_methods_parity
            --test gate_census_surface_parity
            --test gate_crypto_inventory_parity
            --test gate_docs_examples_parity
            --test gate_ffi_symbols_parity
            --test gate_panic_policy_parity
            --test gate_release_parity
            --test gate_sbom_parity
        run: |
          set -euo pipefail
          args=()
          i=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if (( i % 3 == ${{ matrix.shard }} )); then
              # shellcheck disable=SC2206
              args+=($line)
            fi
            i=$((i + 1))
          done <<< "$SHARD_TARGETS"
          echo "shard ${{ matrix.shard }}: $(( ${#args[@]} / 2 )) test targets"
          # -j 2: each test binary links the ~485 MB runtime archive. At the
          # runner's default -j (one job per core) four concurrent links have
          # been observed to OOM the linker outright — run 41757262699 died with
          # `collect2: fatal error: ld terminated with signal 7 [Bus error]`.
          # Two parallel links keeps peak RSS inside the runner's memory and
          # still finishes a ~15 minute shard inside its 30 minute budget.
          cargo test --locked --no-fail-fast -j 2 "${args[@]}" -- --test-threads=2

  # Structured logging (G52): `log.record` / `log.set_trace` / `log.trace`, per
  # docs/spec/STRUCTURED-LOGGING.md. Each case drives the real binary on the
  # interpreter plane (`run --interpret`), because the level/format/sink/trace
  # state is process-wide statics and a fresh process is the only way to observe
  # the defaults; the compiled `log.*` arm still predates that configuration.
  # --test-threads=2: each case spawns its own `tallow` process.
  structured-logging:
    name: Structured logging (G52)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (SHA pin)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: tallow-ci
      - name: Install the native link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang liblzma-dev libbz2-dev
      - name: Build the engine under test
        run: cargo build --locked --bin tallow
      - name: Run the structured-logging gates
        run: cargo test --locked --test structured_logging -- --test-threads=2

  conformance:
    name: Language conformance (interpreter + native)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (SHA pin)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: tallow-ci
      - name: Install the native link dependencies
        # The suite runs every case on BOTH planes; the native plane compiles
        # through clang and links -llzma / -lbz2. Without these the native half
        # fails at link time and every case looks like a language regression.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang liblzma-dev libbz2-dev
      - name: Build the engine under test
        run: cargo build --locked --bin tallow
      - name: Run the conformance corpus
        # Was release-only until 2026-10-23: a language change could pass every
        # unit test and only be caught at the next tag. The runner is a Rust test
        # target (`tests/conformance_runner.rs`), so the suite goes through the
        # same `cargo test` path as every other check and has no interpreter
        # dependency of its own. TALLOW_BIN keeps it pinned to the binary this job
        # just built rather than anything on PATH.
        env:
          TALLOW_BIN: ${{ github.workspace }}/target/debug/tallow
        run: cargo test --locked --test conformance_runner -- --nocapture

  browser:
    name: Browser suites (headless Chrome for Testing)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (SHA pin)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: tallow-ci
      - name: Install the native link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang liblzma-dev libbz2-dev
      - name: Build the engine
        run: cargo build --locked --bin tallow
      - name: Install Chrome for Testing (pinned SHA-256 per platform)
        # The installer prefers the in-repo pin (src/browser/cft_pins.rs) over
        # "latest stable", so the browser under test is the same build locally and
        # in CI: on this runner that is chrome-headless-shell 156.0.8078.47
        # linux64. The download URL is built from the pin table, which means the
        # only egress this step needs is
        # https://storage.googleapis.com/chrome-for-testing-public/... — a host
        # that must be in configs/tallow/scope/authorized-hosts.toml or the install
        # is refused as `scope:not-listed` BEFORE the GET and the CLI exits 5
        # (exit_codes::IO_ERROR). That refusal, not a network error, is what took
        # this job and the WordPress job red on 2026-11-02.
        #
        # TALLOW_ALLOW_DIRECT is still required: the browser zone routes through
        # Tor by contract and this runner has no Tor plane, so the direct plane
        # has to be opted into explicitly.
        env:
          TALLOW_ALLOW_DIRECT: "1"
        run: ./target/debug/tallow browser install
      - name: Assert the installed browser is the pinned build
        # Pins the subject of every suite below. A pin-table miss no longer falls
        # back quietly: install_browser then calls fetch_latest_stable_version,
        # whose host (googlechromelabs.github.io) is not in
        # configs/tallow/scope/authorized-hosts.toml, so the install exits on
        # `scope:not-listed` — and even a fetched artifact would be refused by
        # the SHA-256 pin check. This assertion is the independent second look:
        # it fails the job if the binary on disk is not the pinned build, so the
        # suites never measure a different browser than the one the previous
        # step claims to install.
        run: ./target/debug/tallow browser path | grep -q 'chrome-headless-shell-156\.0\.8078\.47'
      - name: Run the browser suites that pass on the pinned build
        # Every previously-excluded browser suite now runs here. They were in the
        # registry because no browser existed on the runner, not because they
        # were broken; the last four (array parity at 0/1/3, flow runtime) were
        # blocked by an interpreter defect that wrapped browser array results in
        # `Ok(…)`, which is fixed (9446bd1).
        env:
          TALLOW_ALLOW_DIRECT: "1"
        run: |
          # --test-threads=2: each case drives its own headless browser; more
          # parallelism contends for loopback ports rather than saving time.
          cargo test --locked --no-fail-fast \
            --test browser_antibot_opts \
            --test browser_sentinels_live \
            --test browser_array_parity_n \
            --test browser_array_parity_cookies \
            --test browser_array_parity_links \
            --test browser_flow_runtime_integration \
            --test browser_antibot_parity \
            --test browser_array_len \
            --test browser_authenticated_parity \
            --test browser_callbacks_parity \
            --test browser_codegen_integration \
            --test browser_ffi_error_visibility \
            --test browser_form_parity \
            --test browser_landlock_smoke \
            --test browser_native_parity \
            --test browser_navigation_parity \
            --test browser_network_callbacks_parity \
            --test browser_page_events_shared \
            --test browser_page_methods \
            --test browser_result_field_refusal \
            --test browser_ui_events_parity \
            --test browser_unlowered_gaps \
            --test crawler_browser_escalation \
            --test juggler_smoke \
            --test nav_direct \
            --test opsec_corpus_acceptance \
            --test wait_net_parity \
            --test wait_url_parity \
            -- --test-threads=2

  # Behavioral parity: interpreter vs native codegen, byte-for-byte stdout + exit code.
  # Drives every tests/parity/parity_programs/*.tl through both paths and requires each to land in a
  # named class: MATCH, REFUSED (a fixture marked `parity: expect-refusal` must be refused by BOTH
  # legs), FALLBACK (marked `parity: expect-build-fallback`, the documented fail-loud case), DIVERGE
  # (fails). An unclassified build failure is reported with its reason and is not counted as a pass.
  wordpress-fixture:
    name: WordPress fixture (wp_* browser helpers)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (SHA pin)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: tallow-ci
      - name: Install the native link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang liblzma-dev libbz2-dev
      - name: Build the engine
        run: cargo build --locked --bin tallow
      - name: Install Chrome for Testing (the wp_* helpers drive a real browser)
        # Same pinned install and the same register requirement as the `browser`
        # job: without the storage.googleapis.com grant in
        # configs/tallow/scope/authorized-hosts.toml the installer is refused as
        # `scope:not-listed` before the GET and exits 5.
        env:
          TALLOW_ALLOW_DIRECT: "1"
        run: ./target/debug/tallow browser install
      - name: Assert the installed browser is the pinned build
        run: ./target/debug/tallow browser path | grep -q 'chrome-headless-shell-156\.0\.8078\.47'
      - name: Start the WordPress fixture
        # docker is present on the runner; the fixture script owns the whole
        # lifecycle (network, mariadb, wordpress, core install) and waits for
        # the front page to answer.
        run: scripts/wordpress_fixture.sh up
      - name: wp_* helpers against the fixture
        # TALLOW_ALLOW_DIRECT is the operator's opt-in: the browser zone routes
        # through Tor by contract, and Tor cannot reach a loopback fixture. The
        # suite is #[ignore]d for exactly that reason, so CI runs it with
        # --ignored rather than removing the guard for every local run.
        env:
          TALLOW_ALLOW_DIRECT: "1"
          WP_URL: http://127.0.0.1:8099
        run: cargo test --locked --test wordpress_login -- --ignored
      - name: Stop the fixture
        if: always()
        run: scripts/wordpress_fixture.sh down

  parity:
    name: Parity (interp vs native)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (SHA pin)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # One shared key: ten per-job caches at ~0.7 GB each were consuming
          # 7 GB of the repository's 10 GB budget and evicting the release
          # compiler archives that actually deliver the speedup.
          shared-key: tallow-ci
      - name: Static preflight (runner syntax + fixtures)
        run: |
          set -euo pipefail
          bash -n tests/parity/run_parity.sh
          n=$(ls tests/parity/parity_programs/*.tl | wc -l)
          echo "parity fixtures: $n"
          test "$n" -ge 1
      - name: Build debug tallow (--locked)
        run: cargo build --locked --bin tallow
      - name: Ensure the native toolchain (clang + liblzma/libbz2)
        # The native plane links generated programs through clang, and the
        # runtime archive references -llzma and -lbz2. Without the dev packages
        # every parity test fails at link time with "cannot find -llzma", which
        # looks like a code defect and is not one.
        run: |
          # `apt-get update` unconditionally, and retry it. On 2026-10-22 this
          # step failed with "404 Not Found" for liblzma-dev because the image's
          # cached package index pointed at a mirror revision that had already
          # rolled; the old form only updated when clang was missing, so a stale
          # index survived. A 404 from a mirror is infrastructure, and it must not
          # read as a parity defect.
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && break
            echo "apt-get update failed (attempt $attempt); retrying"
            sleep 10
          done
          sudo apt-get install -y -o Acquire::Retries=3 --fix-missing \
            clang liblzma-dev libbz2-dev
      - name: Run parity runner (DIVERGE fails)
        run: |
          set -uo pipefail
          rc=0
          bash tests/parity/run_parity.sh > parity-report.txt 2>&1 || rc=$?
          tail -n 12 parity-report.txt
          grep -q '^RESULT: ' parity-report.txt || { echo "parity runner did not reach its RESULT line"; exit 1; }
          echo "parity rc=$rc (rc 0 = no DIVERGE; rc 1 = divergence, failing)"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: parity-report
          path: parity-report.txt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # rust-toolchain.toml pins 1.98.1, so `cargo clippy` resolves to that
          # toolchain; installing clippy only for `stable` left the component
          # absent and the job failed with "'cargo-clippy' is not installed for
          # the toolchain '1.98.1-x86_64-unknown-linux-gnu'".
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # One shared key: ten per-job caches at ~0.7 GB each were consuming
          # 7 GB of the repository's 10 GB budget and evicting the release
          # compiler archives that actually deliver the speedup.
          shared-key: tallow-ci
      - run: cargo clippy --locked --all-targets -- -W clippy::all

  mls-feature:
    name: MLS feature build
    runs-on: ubuntu-latest
    # The default build refuses crypto.mls_* by name (openmls is opt-in because
    # its dependency tree conflicts with the pinned ml-kem stack), so the whole
    # MLS path — FFI, native lowering, group flow — is invisible to every other
    # job here. This job is the only thing that compiles it.
    #
    # Cost, stated: it recompiles the crate with a different feature set, so it
    # cannot share the default build's artifacts. It is a full build.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: tallow-mls
      - name: Build with the mls feature
        run: cargo build --locked --features mls --bin tallow
      - name: Run the MLS group flow on the native plane
        # examples/mls_probe.rs drives create -> add -> join -> encrypt -> process
        # through the same registry the language surface uses.
        run: cargo run --locked --quiet --features mls --example mls_probe
      - name: Assert the default build still refuses by name
        # The complement of the above: without the feature the surface must fail
        # with a message naming it, not link-error or silently do nothing.
        run: |
          cargo build --locked --bin tallow
          printf 'fn main() {\n    let k = crypto.mls_create_group("a")\n    print(k.handle)\n}\n' > /tmp/mls_refuse.tl
          if ./target/debug/tallow run --require-native /tmp/mls_refuse.tl; then
            echo "default build must refuse crypto.mls_*"; exit 1
          fi
          ./target/debug/tallow run --require-native /tmp/mls_refuse.tl 2>&1 | grep -q "features mls"

  zk-feature:
    name: ZK feature build
    runs-on: ubuntu-latest
    # `zk` is opt-in: the default build does not link curve arithmetic. Without
    # this job the range-proof module and its surface arms are never compiled.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: tallow-zk
      - run: cargo test --locked --features zk --test zk_proof
      - run: "cargo test --locked --features zk --lib zk:: -- --nocapture"
      - name: The default build refuses by name
        run: |
          cargo build --locked --bin tallow
          printf 'fn main() {\n    let p = crypto.zk_range_prove(1, 8, "00")\n    print(p.proof)\n}\n' > /tmp/zk_refuse.tl
          # --interpret, not --require-native: there is no ZK native lowering, so
          # --require-native fails on THAT first and the feature message never
          # appears. The assertion is about the feature gate.
          if ./target/debug/tallow run --interpret /tmp/zk_refuse.tl; then
            echo "default build must refuse crypto.zk_*"; exit 1
          fi
          ./target/debug/tallow run --interpret /tmp/zk_refuse.tl 2>&1 | grep -q "features zk"

  fhe-feature:
    name: FHE feature build
    runs-on: ubuntu-latest
    # tfhe is a large dependency; key generation measured 1.4 s on the dev box,
    # so the tests run normally rather than being excluded from the default run.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: tallow-fhe
      - run: "cargo test --locked --features fhe --lib fhe:: -- --nocapture"

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # rustsec/audit-check reports its verdict by POSTing a check run, and the
    # repository default token is read-only: with no `checks: write` the action
    # fails at `Resource not accessible by integration` *after* a clean scan
    # (0 vulnerabilities), turning a pass into a red job.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2 (SHA pin)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Blocking: deny.toml advisory verdicts are deny (vulnerability/unmaintained/yanked).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features
      # The ignore lists carry a review deadline that nothing read until 2026-10-31.
      # cargo-deny has no expiry for `ignore` entries, so the date in the comments was
      # decorative; this step makes a passed deadline fail the job.
      - name: Ignored-advisory review deadlines
        run: python3 scripts/check_deny_expiry.py

  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # One shared key: ten per-job caches at ~0.7 GB each were consuming
          # 7 GB of the repository's 10 GB budget and evicting the release
          # compiler archives that actually deliver the speedup.
          shared-key: tallow-ci
      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename tallow.sbom.json
          cargo cyclonedx --format json --override-filename tallow-crypto.sbom.json --manifest-path crates/tallow-crypto/Cargo.toml
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: '*.sbom.json'

  # ── SBOM drift gate (blocking) ─────────────────────────────────────────────
  # Regenerates the committed package inventory from `cargo metadata --offline --locked` (no build;
  # resolves from the committed Cargo.lock) and fails if it differs from the snapshot. Dependency
  # drift must land together with an explicit snapshot update in the same change.
  sbom-drift:
    name: SBOM drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Regenerate SBOM and fail on drift
        run: python3 scripts/sbom-gen.py --check scripts/sbom.snapshot.json

  # ── CBOM drift gate (blocking) ─────────────────────────────────────────────
  # Fully static, stdlib-only python3 — no toolchain, no build, no network. Fails when the committed
  # crypto inventory does not byte-match regeneration, when a crypto-shaped token is not covered by
  # the embedded agility registry, or when an active registered algorithm disappears from source.
  # Update the artifact in the same change: python3 scripts/crypto-inventory.py --write scripts/crypto-inventory.json
  cbom-drift:
    name: CBOM drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Regenerate CBOM seed and fail on drift
        run: python3 scripts/crypto-inventory.py --check scripts/crypto-inventory.json

  claims-ledger:
    name: Claims-ledger gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the ledger's one dependency
        run: python3 -m pip install --quiet pyyaml
      - name: Check the claims ledger
        # rc 0 = clean, 2 = warnings only (the adopted baseline), 1 = hard findings.
        run: |
          set +e
          python3 scripts/claims_ledger_check.py --format text
          rc=$?
          echo "claims-ledger rc=$rc"
          if [ "$rc" -eq 1 ]; then exit 1; fi

  # ── Canonical-pin gate (blocking) ──────────────────────────────────────────
  # tallow-crypto, tallow-net, tallow-protocol and tallow-svid are canonical in THIS repository and
  # vendored into sendtallow. Fully static — no build, no network: it hashes the crate sources and
  # fails when a pinned file changed without the manifest being regenerated, which is how a
  # one-sided edit silently diverges between the two repositories.
  # Regenerate in the same change: scripts/gen-canonical-pins.sh
  wire-conformance:
    name: Wire conformance (room-id derivation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the tallow binary
        run: cargo build --bin tallow
      - name: Rust crate matches the committed vectors
        run: cargo test --test relay_room_id_conformance
      - name: The language surface matches the crate, on both engines
        # Checks agreement on accepted codes AND refusal on the rest: the strict-8 rule is part of
        # the contract, so a code one side accepts and the other refuses is an interop break too.
        run: bash scripts/relay_room_id_conformance.sh target/debug/tallow

  canonical-pins:
    name: Canonical pin gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify vendored canonical crate pins
        run: cd crates && sha256sum -c CANONICAL-SYNC.sha256
      - name: The manifest is regenerable from the working tree
        # Catches a manifest regenerated with different exclusions or flags than the committed one,
        # which `sha256sum -c` alone cannot see: it only compares files to the manifest it is given.
        run: |
          cp crates/CANONICAL-SYNC.sha256 /tmp/committed.sha256
          scripts/gen-canonical-pins.sh
          if ! diff -u /tmp/committed.sha256 crates/CANONICAL-SYNC.sha256; then
            echo "::error::the manifest does not match the tree — regenerate with scripts/gen-canonical-pins.sh"
            exit 1
          fi
      - name: The manifest names repositories, never paths
        # A hard-coded clone location turns a repo rename into a false drift report.
        run: |
          if grep -nE '^(/|~|[A-Za-z]:[\\/])|/home/|/Users/' crates/CANONICAL-SYNC.sha256; then
            echo "::error::the manifest carries a filesystem path; it must name repositories, never locations"
            exit 1
          fi
          echo "manifest carries no paths"
      - name: Cross-tree drift report
        # The product is a separate private repository, so this can only measure drift where it is
        # checked out. It reports rather than fails when absent, instead of pretending to verify.
        run: |
          if [ -n "${TALLOW_PRODUCT_ROOT:-}" ]; then
            bash scripts/sync-canonical-crates.sh --check
          else
            echo "TALLOW_PRODUCT_ROOT unset — cross-tree drift is measured where the product is checked out:"
            echo "  TALLOW_PRODUCT_ROOT=/path/to/product bash scripts/sync-canonical-crates.sh --check"
          fi

  # ── Performance regression gate (blocking) ─────────────────────────────────
  # The jobs above gate composition; none measured speed (upgrade sheet §1). This is that missing
  # gate: it runs the compiler/parser harness (benchmarks/) over the PINNED corpus
  # (benchmarks/corpus/, manifest + sha256) and blocks on the machine-independent metrics —
  # success_rate and unresolved — plus wide target ranges on timing/memory. Timing is compared
  # against a baseline only when (arch, build profile, corpus) all match; the selection is by
  # directory so a per-architecture capture slots in without code change. Two other things:
  #   * it re-verifies the pin (scripts/pin_perf_corpus.py --check) and the gate's own
  #     --self-test, so a broken gate or a hand-edited corpus fails HERE.
  #   * the live examples/*.tl tree is measured separately, so pinning the perf corpus does not
  #     stop CI noticing that a current example stopped type-checking.
  perf-regression:
    name: Perf regression gate (compiler/parser)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (SHA pin)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # One shared key: ten per-job caches at ~0.7 GB each were consuming
          # 7 GB of the repository's 10 GB budget and evicting the release
          # compiler archives that actually deliver the speedup.
          shared-key: tallow-ci
      - name: Gate self-test (proves the gate fails on a seeded regression)
        run: python3 scripts/no_regression_gate.py --self-test
      - name: Verify the pinned benchmark corpus
        run: python3 scripts/pin_perf_corpus.py --check
      - name: Build debug tallow
        run: cargo build --locked --bin tallow
      - name: Measure the pinned corpus (compiler/parser)
        run: >-
          python3 benchmarks/run_compiler_parser.py --tallow target/debug/tallow
          --corpus-manifest benchmarks/corpus/manifest.json
          --iters 3 --warmup 1 --out benchmarks/out/current.json
      # Live-tree coverage is kept separate from the perf measurement: the pinned
      # corpus is a frozen fixture (so the perf identity cannot drift when an example
      # is edited), which would otherwise stop this job noticing that a CURRENT
      # examples/*.tl stopped type-checking. Same harness, no baseline, ranges only.
      - name: Measure the live examples tree (correctness coverage)
        run: >-
          python3 benchmarks/run_compiler_parser.py --tallow target/debug/tallow
          --corpus-glob 'examples/*.tl' --iters 1 --warmup 1
          --out benchmarks/out/examples.json
      - name: Examples still type-check (inside the committed ranges)
        run: >-
          python3 scripts/no_regression_gate.py --targets benchmarks/targets/v1-targets.json
          --current benchmarks/out/examples.json
      # BLOCKING, and it gates on BOTH surfaces:
      #
      #   --targets   absolute ranges. Platform-independent, so they hold on any runner.
      #   --baseline  a DIRECTORY of per-arch/per-profile captures. The gate selects the
      #               one matching this runner's (arch, profile); with no exact match it
      #               falls back to the newest for the machine-independent metrics
      #               (success_rate, unresolved) and prints why timing was skipped.
      #   --corpus-manifest  the measurement must be over the pinned corpus; a run over
      #               anything else is a different measurement, not a regression.
      #
      # TIMING is deliberately not gated across machines: this runner is x86_64/debug
      # and the committed timing baselines are aarch64/release, so the ms/throughput/RSS
      # budgets are skipped and the skip is printed. Unknown arch or profile fails closed.
      # Same-(arch,profile) runs (local, nightly, a future matching runner) therefore get
      # the timing gate for free. To add an x86_64 baseline, measure it on an x86_64 box
      # with the pinned corpus and commit benchmarks/baseline/v1.7.0-x86_64.json; the
      # gate picks it up with no code change.
      - name: Block on regression (target ranges + environment-independent baseline)
        run: >-
          python3 scripts/no_regression_gate.py --targets benchmarks/targets/v1-targets.json
          --baseline benchmarks/baseline
          --corpus-manifest benchmarks/corpus/manifest.json
          --current benchmarks/out/current.json --report perf-verdict.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: perf-verdict
          path: perf-verdict.json
