name: CI

# Carried from the development tree, scoped to what this repository can actually run.
#
# The development tree's ci.yml has 15 jobs. Thirteen are carried, and two are not — each for a reason
# that was MEASURED here rather than assumed, because a gate that cannot pass is worse than a gate
# left behind (a permanently red check gets ignored). Their inputs are carried anyway, so adopting
# any of them later is a one-line change:
#
#   vet            inputs carried (`supply-chain/{config,audits.toml,imports.lock}`) but the ledger
#                  is empty — `audits.toml` is 35 bytes — so `cargo vet --locked` has nothing to
#                  certify against. Unproven here; not wired.
#   claims-ledger  **carried as of 2026-10-20.** It was rc=1 with 23 hard findings, every one a
#                  "missing source file" anchor to a document never committed here (CLAUDE.md,
#                  tallow_1000x_upgrade_prompt.md, docs/mega/tallow-2.0-spec.md, .planning/*).
#                  The anchors now resolve to docs/mega/claims-provenance-gaps.md, which records
#                  each original anchor verbatim and is explicitly not a claim that the original
#                  text still exists. The 26 remaining R4 sweep warnings were then attributed by
#                  anchor (four new rows) or removed as false positives in the patterns themselves
#                  (`BLAKE2s` matching "2s"; "Government & Military" matching a banned adjective).
#                  Current: 72 entries, 0 hard, 0 warnings, rc=0. The job accepts 0|2.
#   fmt            the tree is not cargo-fmt clean: `cargo fmt --all -- --check` reports 7,902
#                  files and 121,519 diff lines (import-ordering style — `use std::sync::{Arc, mpsc}`
#                  against `{mpsc, Arc}`), i.e. rustfmt has never been run across this workspace.
#                  That is a repo-wide style decision, not a defect to fix in passing.
#
# `sbom-drift` and `cbom-drift` ARE carried, together with their inputs and their regenerated
# artifacts. Carrying them surfaced a real upstream defect worth recording: **both gates failed on
# drift when first run**, which means neither could pass anywhere — the committed artifacts were
# stale relative to the source (the crypto inventory was short by ~99 occurrences; the SBOM was
# short by 77 packages, including a dependency absent from the snapshot entirely). A gate that is
# not wired into a runner is not a check; these two are now wired here and green:
#
#   cbom-drift   scripts/crypto-inventory.py --check scripts/crypto-inventory.json
#                44 registered, 44 present, 2,124 occurrences, 0 unregistered candidates
#   sbom-drift   scripts/sbom-gen.py --check scripts/sbom.snapshot.json   (721 packages)
#
# A stale figure still circulates in the development tree's ci.yml: "463 occurrences across 16
# algorithms". The artifact says otherwise — 44 algorithms — and has for some time. The number is a
# comment, not a measurement, and it is corrected here rather than inherited.
#
# The three platform `test-*` jobs are green at this revision: `cargo test -p tallow --lib` reports
# 9,007 passed / 0 failed / 21 ignored at `bb31b3f`. They were red at `9d3b1f5` on eleven stale room-code
# fixtures in `src/stdlib/transfer_net.rs` (8,996 / 11 / 21) that passed human-readable codes to a join
# contract accepting the 8-symbol mint only. The fixtures now take their code from the runtime's own mint —
# test-side only, inside `mod tests` — so the contract and the tests cannot drift apart again.
#
# `RUSTFLAGS: -D warnings` is deliberately NOT set at workflow level. This tree carries a
# pre-existing warning baseline (159 in the lib test target alone, e.g. the Rust 2024
# `unsafe_op_in_unsafe_fn` lint in src/runtime/{env,html}_ffi.rs); with `-D warnings` every cargo
# job below would fail on warnings predating this repository, which measures nothing. The
# development tree's own parity job neutralizes the same variable for the same reason. Making
# warnings blocking is a separate work item, not a side effect of publishing.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 8388608

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (SHA pin)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --locked --all-targets

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    needs: check
    steps:
      # fetch-depth: 0 -- attribution needs the base revision present in the clone
      # so a failing test can be re-run against it; a shallow clone cannot reach
      # the merge-base and every label would come back UNKNOWN.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test
        run: |
          set -o pipefail
          cargo test --locked --lib -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/test.log"
      # Every failing test is labelled pre-existing or caused by RUNNING it at the
      # base revision (scripts/attribute_failure.py, docs/FAILURE-ATTRIBUTION.md).
      # That costs a build of the base tree, on failure only -- the label is proven
      # rather than guessed. The other two test jobs follow this shape.
      - name: Attribute failures
        if: failure()
        run: python3 scripts/attribute_failure.py --log "$RUNNER_TEMP/test.log"

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked --lib -- --test-threads=2

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked --lib -- --test-threads=2

  # Zero-trust conformance: negative boundary probes (browser-zone predicate refusals,
  # non-loopback CDP connect refusals, the CDP relay's 8 MiB frame cap — loopback only, no network).
  zero-trust-conformance:
    name: Zero-trust conformance (negative boundary probes)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (SHA pin)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked --test zero_trust_conformance -- --test-threads=1

  # Contract and CLI integration suites.
  #
  # `cargo test --lib` cannot see tests/*.rs at all, so before this job existed 58 of the 60
  # integration targets ran in no pipeline. That is how tests/fixtures/audit_golden/cra.json sat
  # failing, unnoticed, through a version bump: the contract it pins was executed by nothing.
  #
  # The eight below were RUN here on 2026-10-16, not assumed, and are green at that revision.
  # `--no-fail-fast` so that a future break in one suite still reports the other seven.
  #
  # Four candidates were run and excluded. Three are real defects in this tree rather than suites
  # that cannot execute, and fixing them belongs where the code is — wiring a red check would only
  # teach us to ignore it:
  #
  #   request_plan_cli       0 / 38   every test fails identically: `error: unexpected argument
  #                                   '--check' found` — the verb this suite drives is not in this build
  #   pkg_cli                FIXED and promoted above — pkg remove now deletes the package directory
  #                                   (remove_dir_all, with failures surfaced) — verified 14 passed, 0 failed
  #   sec1_honesty_sweep     FIXED and promoted above — the assertion was the stale side; the document's 23
  #                                   matches src/main.rs's 23 named flags — verified 9 passed, 0 failed
  #   http_result_model      FIXED and promoted above — the typed BatchResponse/HttpError model now exists
  #                                   (http_batch classifies 4xx as a result carrying its body, transport
  #                                   failures as kind "transport"), and stdlib/http.tl declares it —
  #                                   verified 3 passed, 0 failed. The status-as-error override is scoped to
  #                                   a function-local agent on the loopback path, so http.get/post semantics
  #                                   are unchanged (http unit tests still 61 passed, 0 failed).
  contract-cli:
    name: Contract and CLI suites (integration)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (SHA pin)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Capability registry matches the code
        run: |
          python3 scripts/census_page_methods.py
          python3 scripts/census_surface.py
          python3 scripts/check_ffi_symbols.py
          python3 scripts/check_capability_registry.py
      - name: Every test target is run or explicitly excluded
        run: python3 scripts/check_test_coverage.py
      - run: >-
          cargo test --locked --no-fail-fast
          --test audit_cli_contract
          --test fingerprint_audit_cli
          --test http_result_model
          --test pkg_cli
          --test replay_determinism
          --test scope_gate
          --test sec1_honesty_sweep
          --test stdlib_scraper_doctor_cli
          --test transport_coherence_audit
          --test vault_enforcement_cli
          --test veil_connect_cli
          --test pkg_archive
          --test pkg_cache
          --test stdlib_math_env
          --test transfer_bwlimit
          --test crawler_parity
          --test interp_codegen_parity
          --test generated_tl_parity
          --test optional_parity
          --test process_exec_parity
          --test result_truthiness_parity
          --test deals_integration
          --test artifact_sealing
          --test browser_contracts
          --test browser_dispatch_reachability
          --test browser_fallback_service
          --test closure_capture_return
          --test copy_engine_basic
          --test derived_recompute
          --test export_gate_matrix
          --test extraction_migration
          --test fingerprint_coherence_suite
          --test fingerprint_policy_pass_e2e
          --test fixity_drill
          --test kt_log_read_only
          --test mcp_client
          --test pkg_import
          --test pkg_lockfile
          --test pkg_manifest
          --test pkg_registry
          --test pkg_resolver
          --test proxy_layers_integration
          --test relay_ws_interop
          --test sigpipe_pipeline
          --test stdlib_dispatch
          --test stdlib_fs
          --test stdlib_json
          --test stdlib_rand
          --test stdlib_time_log
          --test struct_array_parity
          --test structured_data_parity
          --test transfer_chunk_parity
          -- --test-threads=2

  # Behavioral parity: interpreter vs native codegen, byte-for-byte stdout + exit code.
  # Drives every tests/parity/parity_programs/*.tl through both paths and requires each to land in a
  # named class: MATCH, REFUSED (a fixture marked `parity: expect-refusal` must be refused by BOTH
  # legs), FALLBACK (marked `parity: expect-build-fallback`, the documented fail-loud case), DIVERGE
  # (fails). An unclassified build failure is reported with its reason and is not counted as a pass.
  parity:
    name: Parity (interp vs native)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (SHA pin)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Static preflight (runner syntax + fixtures)
        run: |
          set -euo pipefail
          bash -n tests/parity/run_parity.sh
          n=$(ls tests/parity/parity_programs/*.tl | wc -l)
          echo "parity fixtures: $n"
          test "$n" -ge 1
      - name: Build debug tallow (--locked)
        run: cargo build --locked --bin tallow
      - name: Ensure clang present (native path links via clang)
        run: command -v clang >/dev/null || { sudo apt-get update && sudo apt-get install -y clang; }
      - name: Run parity runner (DIVERGE fails)
        run: |
          set -uo pipefail
          rc=0
          bash tests/parity/run_parity.sh > parity-report.txt 2>&1 || rc=$?
          tail -n 12 parity-report.txt
          grep -q '^RESULT: ' parity-report.txt || { echo "parity runner did not reach its RESULT line"; exit 1; }
          echo "parity rc=$rc (rc 0 = no DIVERGE; rc 1 = divergence, failing)"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: parity-report
          path: parity-report.txt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --locked --all-targets -- -W clippy::all

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2 (SHA pin)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Blocking: deny.toml advisory verdicts are deny (vulnerability/unmaintained/yanked).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename tallow.sbom.json
          cargo cyclonedx --format json --override-filename tallow-crypto.sbom.json --manifest-path crates/tallow-crypto/Cargo.toml
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: '*.sbom.json'

  # ── SBOM drift gate (blocking) ─────────────────────────────────────────────
  # Regenerates the committed package inventory from `cargo metadata --offline --locked` (no build;
  # resolves from the committed Cargo.lock) and fails if it differs from the snapshot. Dependency
  # drift must land together with an explicit snapshot update in the same change.
  sbom-drift:
    name: SBOM drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Regenerate SBOM and fail on drift
        run: python3 scripts/sbom-gen.py --check scripts/sbom.snapshot.json

  # ── CBOM drift gate (blocking) ─────────────────────────────────────────────
  # Fully static, stdlib-only python3 — no toolchain, no build, no network. Fails when the committed
  # crypto inventory does not byte-match regeneration, when a crypto-shaped token is not covered by
  # the embedded agility registry, or when an active registered algorithm disappears from source.
  # Update the artifact in the same change: python3 scripts/crypto-inventory.py --write scripts/crypto-inventory.json
  cbom-drift:
    name: CBOM drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Regenerate CBOM seed and fail on drift
        run: python3 scripts/crypto-inventory.py --check scripts/crypto-inventory.json

  claims-ledger:
    name: Claims-ledger gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the ledger's one dependency
        run: python3 -m pip install --quiet pyyaml
      - name: Check the claims ledger
        # rc 0 = clean, 2 = warnings only (the adopted baseline), 1 = hard findings.
        run: |
          set +e
          python3 scripts/claims_ledger_check.py --format text
          rc=$?
          echo "claims-ledger rc=$rc"
          if [ "$rc" -eq 1 ]; then exit 1; fi

  # ── Canonical-pin gate (blocking) ──────────────────────────────────────────
  # tallow-crypto, tallow-net, tallow-protocol and tallow-svid are canonical in THIS repository and
  # vendored into sendtallow. Fully static — no build, no network: it hashes the crate sources and
  # fails when a pinned file changed without the manifest being regenerated, which is how a
  # one-sided edit silently diverges between the two repositories.
  # Regenerate in the same change: scripts/gen-canonical-pins.sh
  wire-conformance:
    name: Wire conformance (room-id derivation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the tallow binary
        run: cargo build --bin tallow
      - name: Rust crate matches the committed vectors
        run: cargo test --test relay_room_id_conformance
      - name: The language surface matches the crate, on both engines
        # Checks agreement on accepted codes AND refusal on the rest: the strict-8 rule is part of
        # the contract, so a code one side accepts and the other refuses is an interop break too.
        run: bash scripts/relay_room_id_conformance.sh target/debug/tallow

  canonical-pins:
    name: Canonical pin gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify vendored canonical crate pins
        run: cd crates && sha256sum -c CANONICAL-SYNC.sha256
      - name: The manifest is regenerable from the working tree
        # Catches a manifest regenerated with different exclusions or flags than the committed one,
        # which `sha256sum -c` alone cannot see: it only compares files to the manifest it is given.
        run: |
          cp crates/CANONICAL-SYNC.sha256 /tmp/committed.sha256
          scripts/gen-canonical-pins.sh
          if ! diff -u /tmp/committed.sha256 crates/CANONICAL-SYNC.sha256; then
            echo "::error::the manifest does not match the tree — regenerate with scripts/gen-canonical-pins.sh"
            exit 1
          fi
      - name: The manifest names repositories, never paths
        # A hard-coded clone location turns a repo rename into a false drift report.
        run: |
          if grep -nE '^(/|~|[A-Za-z]:[\\/])|/home/|/Users/' crates/CANONICAL-SYNC.sha256; then
            echo "::error::the manifest carries a filesystem path; it must name repositories, never locations"
            exit 1
          fi
          echo "manifest carries no paths"
      - name: Cross-tree drift report
        # The product is a separate private repository, so this can only measure drift where it is
        # checked out. It reports rather than fails when absent, instead of pretending to verify.
        run: |
          if [ -n "${TALLOW_PRODUCT_ROOT:-}" ]; then
            bash scripts/sync-canonical-crates.sh --check
          else
            echo "TALLOW_PRODUCT_ROOT unset — cross-tree drift is measured where the product is checked out:"
            echo "  TALLOW_PRODUCT_ROOT=/path/to/product bash scripts/sync-canonical-crates.sh --check"
          fi

  # ── Performance regression gate (blocking) ─────────────────────────────────
  # The jobs above gate composition; none measured speed (upgrade sheet §1). This is that missing
  # gate: it runs the compiler/parser harness (benchmarks/) over examples/*.tl and blocks on the
  # machine-independent metrics — success_rate and unresolved — plus wide target ranges on
  # timing/memory. Two things it deliberately does NOT do on a shared runner:
  #   * it does not compare against benchmarks/baseline/v1-baseline-aarch64.json — that baseline is
  #     machine-specific and a GitHub runner is not comparable to it. The same-machine regression
  #     comparison is a local/nightly step (command in benchmarks/README.md).
  #   * it re-runs the gate's own --self-test, so a broken gate fails HERE rather than passing
  #     silently everywhere else.
  perf-regression:
    name: Perf regression gate (compiler/parser)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (SHA pin)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Gate self-test (proves the gate fails on a seeded regression)
        run: python3 scripts/no_regression_gate.py --self-test
      - name: Build debug tallow
        run: cargo build --locked --bin tallow
      - name: Measure examples (compiler/parser)
        run: >-
          python3 benchmarks/run_compiler_parser.py --tallow target/debug/tallow
          --corpus-glob 'examples/*.tl' --iters 3 --warmup 1 --out benchmarks/out/current.json
      # BLOCKING, and it gates on BOTH surfaces:
      #
      #   --targets   absolute ranges. Platform-independent, so they hold on any runner.
      #   --baseline  the committed aarch64 measurement. Its success_rate and unresolved
      #               counts are platform-independent -- they count how many examples
      #               type-check, not how long it took -- so they gate here too, and that
      #               catches a drop INSIDE the target range, which a range check cannot.
      #
      # TIMING is deliberately not gated across platforms: this runner is x86_64 and the
      # baseline is aarch64, so the ms/throughput/RSS budgets are skipped and the skip is
      # printed. Unknown arch fails closed. Same-arch runs (local, nightly, a future arm
      # runner) therefore get the timing gate for free, and cross-arch runs get an honest
      # note rather than a comparison between two unrelated measurements.
      - name: Block on regression (target ranges + environment-independent baseline)
        run: >-
          python3 scripts/no_regression_gate.py --targets benchmarks/targets/v1-targets.json
          --baseline benchmarks/baseline/v1-baseline-aarch64.json
          --current benchmarks/out/current.json --report perf-verdict.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: perf-verdict
          path: perf-verdict.json
